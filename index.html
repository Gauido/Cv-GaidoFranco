<style>
/* Layout: one long scroll; big type up top, a pinned horizontal strip for the case studies, sticky "booking board" as the project's signature visual. */
:root{
  --bg:#F7F8FA; --bg2:#FFFFFF; --fg:#0B0D12; --muted:#5B6270; --line:#E4E7EC;
  --accent:#2457F5; --accent-ink:#FFFFFF; --soft:#EAF0FF; --live:#16A34A;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --f-display:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  --wrap:1120px; --gut:max(20px,env(safe-area-inset-left,0px)); --gutR:max(20px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0D12; --bg2:#12151C; --fg:#EEF0F4; --muted:#959CA9; --line:#232834;
  --accent:#7090FF; --accent-ink:#0B0D12; --soft:#1A2236; --live:#4ADE80; --shadow:none; color-scheme:dark }

/* Lenis base styles */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 1.0625rem/1.65 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:var(--gut);padding-right:var(--gutR)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.025em}
.eyebrow{font:500 1rem/1.3 var(--f-body);color:var(--muted);margin:0 0 1.2rem}

code{font:500 .84em var(--f-mono);background:var(--soft);padding:.1em .35em;border-radius:4px}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:1.5rem;height:62px}
.logo{font:700 1.1rem var(--f-display);text-decoration:none;letter-spacing:-.03em}

.nav{display:flex;gap:1.4rem;margin-left:auto;font-size:.92rem}
.nav a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav a:hover{color:var(--fg)}
.tools{display:flex;gap:.4rem;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button,.icon-btn{font:500 .8rem var(--f-body);background:none;border:0;color:var(--muted);padding:.35rem .6rem;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg{background:var(--bg2)}
.icon-btn{border:1px solid var(--line);width:34px;height:34px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
@media (max-width:860px){.nav{display:none}.tools{margin-left:auto}}

/* Hero */
.hero{padding-block:clamp(3rem,9vw,7rem) clamp(3rem,7vw,6rem);position:relative;border-bottom:1px solid var(--line)}
.status{font:500 1rem var(--f-body);color:var(--muted);margin:0 0 1.6rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.name{font-size:clamp(3.6rem,13vw,11rem);line-height:.92;letter-spacing:-.05em;font-weight:600;margin:0 0 2.5rem;will-change:transform}
.name .line{display:block;overflow:hidden;padding-bottom:.04em}
.name .line:last-child{color:var(--muted)}
.name .ch{display:inline-block}
.js .name .ch{animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + 100ms)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero-foot{display:grid;grid-template-columns:minmax(0,1.2fr) auto;gap:2rem;align-items:end}
.role{font-size:clamp(1.15rem,2vw,1.45rem);line-height:1.45;max-width:36ch;margin:0;color:var(--muted)}
.role strong{color:var(--accent);font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:.55rem;font:500 .95rem var(--f-body);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:.7rem 1.1rem;transition:background .2s,border-color .2s;background:var(--bg2);cursor:pointer;color:var(--fg)}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
@media (max-width:760px){.hero-foot{grid-template-columns:1fr}.cta{justify-content:flex-start}}

/* Marquee */
.marquee{border-block:1px solid var(--line);overflow:hidden;padding-block:1.3rem;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:inline-flex;gap:2.5rem;will-change:transform}
.track span{font:500 clamp(1.1rem,2vw,1.5rem) var(--f-display);letter-spacing:-.01em;color:var(--muted);display:inline-flex;align-items:center;gap:2.5rem}
.track span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--line)}

/* Sections */
.sec{padding-block:clamp(4.5rem,10vw,8rem)}
.sec-title{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1;letter-spacing:-.04em;margin:0 0 3rem}
.profile{font:500 clamp(1.45rem,3vw,2.3rem)/1.3 var(--f-display);letter-spacing:-.025em;margin:0;max-width:30em}
.profile .w{opacity:var(--o,1);transition:opacity .15s linear}

/* Experience */
.jobs{display:grid;border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:2rem;padding-block:2.4rem;border-bottom:1px solid var(--line)}
.job h3{font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.1}
.job .where{color:var(--muted);margin:.7rem 0 0;font-size:.98rem}
.job .when{font:500 .95rem var(--f-body);color:var(--fg);margin:.8rem 0 0}
.job ul{margin:0;padding:0;list-style:none;display:grid;gap:.75rem;color:color-mix(in srgb,var(--fg) 82%,var(--bg))}
.job li{padding-left:1.4rem;position:relative}
.job li::before{content:"–";position:absolute;left:0;top:0;color:var(--muted)}
@media (max-width:760px){.job{grid-template-columns:1fr;gap:1.2rem}}

/* CentralTurnos */
.ct{background:var(--bg2);border-block:1px solid var(--line)}
.ct .wrap{position:relative}
.ct-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3rem;align-items:start}
.ct h2{font-size:clamp(2.8rem,7vw,5.8rem);line-height:.95;letter-spacing:-.05em;margin:0 0 1.5rem}
.ct-sub{font-size:1.1rem;margin:0 0 1.8rem;max-width:44ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 2rem;padding:0;list-style:none}
.chips li{font:400 .95rem var(--f-body);color:var(--muted)}
.chips li:not(:last-child)::after{content:",";}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:3.5rem 0 0}
.nums div{background:var(--bg2);padding:1.5rem}
.nums dt{font:600 clamp(2rem,4.4vw,3rem)/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.nums dd{margin:.6rem 0 0;color:var(--muted);font-size:.92rem}
@media (min-width:980px){.nums{grid-template-columns:repeat(4,minmax(0,1fr))}}
.facts{margin:2.5rem 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 2.5rem}
.facts li{border-top:1px solid var(--line);padding-top:1rem;color:var(--fg)}
@media (max-width:860px){.ct-head{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}

/* Booking board (illustrative) */
.board{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1.2rem;position:sticky;top:90px}
.board-top{display:flex;justify-content:space-between;align-items:center;font:500 .85rem var(--f-body);color:var(--muted);margin-bottom:.9rem;gap:1rem}
.board-grid{display:grid;grid-template-columns:4.6rem repeat(6,minmax(0,1fr));gap:4px;font:400 .75rem var(--f-body);font-variant-numeric:tabular-nums}
.board-grid .h,.board-grid .c{color:var(--muted);display:flex;align-items:center}
.board-grid .h{justify-content:center;padding-bottom:.2rem}
.cell{height:42px;border-radius:5px;border:1px dashed var(--line);display:flex;align-items:flex-end;padding:.3rem .35rem;font-size:.68rem;overflow:hidden}
.cell.b{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);font-weight:500;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.cell.b.wa{background:var(--soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}
.cell.b.fx{background:var(--bg2);color:var(--fg);border:1px solid var(--line)}
.board.pre .cell.b{opacity:0;transform:scale(.6)}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:.9rem;font:400 .8rem var(--f-body);color:var(--muted)}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;background:var(--accent);vertical-align:-2px;margin-right:.35rem}
.legend .wa i{background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.legend .fx i{background:var(--bg2);border:1px solid var(--muted)}
@media (max-width:860px){.board{position:relative;top:0}}

/* Horizontal cases */
.hs{position:relative}
.hs-pin{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:2.2rem}
.hs-head{display:flex;justify-content:space-between;align-items:end;gap:2rem;flex-wrap:wrap}
.hs-head p{max-width:46ch;color:var(--muted);margin:0}
.hs-head .sec-title{margin:0}
.cases{display:flex;gap:1.2rem;padding-left:var(--gut);padding-right:var(--gutR);will-change:transform;width:max-content}
.case{width:min(380px,80vw);flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:1.6rem;display:flex;flex-direction:column;gap:.7rem;min-height:240px}
.case .lbl{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.case .lbl.ok{color:var(--accent);margin-top:auto;padding-top:1rem;border-top:1px solid var(--line)}
.case h4{font-size:1.3rem;line-height:1.2}
.case p{margin:0;font-size:.95rem;color:var(--muted);margin-top:auto}
.hs-bar{height:2px;background:var(--line);position:relative;border-radius:2px}
.hs-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:2px}
.hs.flat{height:auto!important}
.hs.flat .hs-pin{position:static;height:auto;padding-block:clamp(4.5rem,10vw,8rem)}
.hs.flat .cases{width:auto;flex-wrap:wrap;transform:none!important;max-width:var(--wrap);margin-inline:auto}
.hs.flat .case{width:100%;min-height:0}
.hs.flat .hs-bar{display:none}
@media (min-width:700px){.hs.flat .cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Lists */
.dl{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);margin:0;border-top:1px solid var(--line)}
.dl dt,.dl dd{padding-block:1.2rem;border-bottom:1px solid var(--line);margin:0}
.dl dt{font:600 1.05rem var(--f-display)}
.dl dd{color:var(--muted)}
.dl dd b{color:var(--fg);font-weight:600}
@media (max-width:640px){.dl{grid-template-columns:1fr}.dl dt{border-bottom:0;padding-bottom:.2rem}.dl dd{padding-top:0}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4rem}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:4.5rem}}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2rem}
.service{border-top:1px solid var(--fg);padding-top:1.2rem}

.service h3{font-size:1.25rem;margin-bottom:.7rem}
.service p{margin:0;color:var(--muted)}
@media (max-width:860px){.services{grid-template-columns:1fr}}
.how p{font-size:1.15rem;margin:0 0 1.2rem;max-width:56ch}
.edu{display:grid;gap:2rem}
.edu h3{font-size:1.4rem}
.edu p{margin:.4rem 0 0;color:var(--muted)}

/* Contact */
.contact{padding-block:clamp(5rem,12vw,10rem) 3rem;border-top:1px solid var(--line)}
.big{font-size:clamp(3.2rem,11vw,8.5rem);line-height:.95;letter-spacing:-.05em;margin:0 0 1.8rem}
.contact p{font-size:1.15rem;max-width:44ch;margin:0 0 2rem;color:var(--muted)}
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-bottom:1.2rem}
.mail{font:500 clamp(1.1rem,2.6vw,1.6rem) var(--f-body);user-select:all;word-break:break-all}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;color:var(--muted);font:400 .9rem var(--f-body);padding-block:4rem 2rem}

/* Reveal */
.rv{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.pre{opacity:0;transform:translateY(40px)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv.pre,.board.pre .cell.b{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>

</head>

<script>

// Reveal on scroll: only items that start below the fold are hidden, so the first frame is complete.
let io;
function setupReveal(){
  if (io) io.disconnect();
  if (reduce || !("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.remove("pre");
    if (e.target.id === "board") animateBoard();
    if (e.target.id === "nums") countUp();
    io.unobserve(e.target);
  }), { rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".rv, #board, #nums").forEach(el => {
    if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("pre"); io.observe(el); }
  });
}
function animateBoard(){
  [...document.querySelectorAll("#board .cell.b")].forEach((c,i) => { c.style.transitionDelay = (i*55) + "ms"; });
}
function countUp(){
  document.querySelectorAll("#nums dt").forEach(dt => {
    const raw = dt.dataset.n, m = raw.match(/^(\D*)([\d.,]+)(\D*)$/);
    if (!m) return;
    const target = parseInt(m[2].replace(/[.,]/g,""),10), sep = lang === "es" ? "." : ",";
    const t0 = performance.now(), dur = 1400;
    const step = now => {
      const p = Math.min(1,(now-t0)/dur), e = 1 - Math.pow(1-p,3);
      const v = Math.round(target*e).toString().replace(/\B(?=(\d{3})+(?!\d))/g, sep);
      dt.textContent = m[1] + v + m[3];
      if (p < 1) requestAnimationFrame(step); else dt.textContent = raw;
    };
    requestAnimationFrame(step);
  });
}

const hs = $("#casos"), cases = $("#cases");
let hsDist = 0;
function layoutH(){
  const flat = reduce || innerWidth < 760;
  hs.classList.toggle("flat", flat);
  if (flat){ hs.style.height = ""; hsDist = 0; return; }
  hsDist = Math.max(0, cases.scrollWidth - innerWidth);
  hs.style.height = (innerHeight + hsDist) + "px";
}

// Scroll-driven effects
let mx = 0, vel = 0, lastY = scrollY;
const nameEl = $("#name"), bar = $("#bar");
function onScroll(){
  const y = scrollY;
  bar.classList.toggle("scrolled", y > 10);
  if (!reduce){
    nameEl.style.transform = `translate3d(0,${Math.min(y,600)*0.25}px,0)`;
    // profile words light up as the paragraph passes the middle of the screen
    const words = document.querySelectorAll("#profile .w"), r = $("#profile").getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (innerHeight*0.85 - r.top) / (r.height + innerHeight*0.35)));
    const lit = p * words.length;
    words.forEach((w,i) => w.style.setProperty("--o", i < lit ? 1 : 0.22));
  }
  if (hsDist){
    const r = hs.getBoundingClientRect(), p = Math.min(1, Math.max(0, -r.top / (hs.offsetHeight - innerHeight)));
    cases.style.transform = `translate3d(${-p*hsDist}px,0,0)`;
    $("#hsBar").style.width = (p*100) + "%";
  }
}

let lenis = null;
if (window.Lenis && !reduce){

  document.documentElement.style.scrollBehavior = "auto";
} else {
  addEventListener("scroll", onScroll, { passive: true });
}
function raf(time){
  if (lenis) lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

// Anchor links through Lenis
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute("href"), el = id === "#top" ? document.body : document.querySelector(id);
  if (!el) return;
  e.preventDefault();
  if (lenis) lenis.scrollTo(el, { offset: -70, duration: 1.4 });
  else el.scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
});

// Controls
document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => render(b.dataset.setLang)));
$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark";
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("fg-theme", root.dataset.theme); } catch(e){}
});
$("#copyBtn").addEventListener("click", () => {
  const span = $("#copyBtn span"), done = () => { span.textContent = U[lang].copied; setTimeout(() => span.textContent = U[lang].copy, 1800); };
  const sel = () => { const r = document.createRange(); r.selectNodeContents($("#mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  if (navigator.clipboard) navigator.clipboard.writeText($("#mail").textContent).then(done, sel); else sel();
});
addEventListener("resize", () => { layoutH(); onScroll(); });

let start = "es";
try { start = localStorage.getItem("fg-lang") || (navigator.language || "es").slice(0,2); } catch(e){}
render(T[start] ? start : "es");
</script>

</body>
